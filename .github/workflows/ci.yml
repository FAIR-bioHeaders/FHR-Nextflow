# Runs the supported baseline: Nextflow 26.04.6, Java 21, Python 3.13 and
# FHR-File-Converter 0.3.0. Actions and downloads are pinned by digest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NXF_VER: 26.04.6
  # sha256 of the nextflow-26.04.6-dist release asset (self-contained launcher).
  NXF_DIST_SHA256: 182a63c74074e2dc7956ffa3c8cd59de952ed2c44394e21faf5e1736b945444c
  # FHR-File-Converter tag v0.3.0; the commit is pinned because tags can move.
  CONVERTER_COMMIT: 8fd80df3c1aab6ee8c8545b860c74b324ab15ce3
  NXF_ANSI_LOG: 'false'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out FHR-File-Converter v0.3.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FAIR-bioHeaders/FHR-File-Converter
          ref: ${{ env.CONVERTER_COMMIT }}
          path: converter
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Nextflow
        run: |
          curl -fsSL -o nextflow "https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow-${NXF_VER}-dist"
          echo "${NXF_DIST_SHA256}  nextflow" | sha256sum --check
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Install the converter environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps -r environment/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip check
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Integration tests
        run: python tests/run.py --converter-source converter

      - name: Build container
        run: docker build -t fhr-nextflow:0.1.0 environment

      - name: Docker example
        env:
          NXF_OFFLINE: 'true'
        run: |
          nextflow run main.nf -profile docker \
            --sequence examples/assembly.gfa --sequence_format gfa \
            --converter_source converter --outdir "$RUNNER_TEMP/results"
          test -s "$RUNNER_TEMP/results/example/sequence/example.fhr.gfa"
          test -s "$RUNNER_TEMP/results/converter-tests/converter-tests.xml"

      - run: git diff --check HEAD
